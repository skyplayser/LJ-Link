name: Website

# Die Website ist nach https://link-suite.de umgezogen. GitHub Pages liefert nur noch die Weiterleitungen aus
# pages-weiterleitung/ aus, damit alte Links und Google-Treffer am richtigen Ziel landen. Der alte Stand der Website
# liegt im Tag "website-github-pages-archiv"; site/ wird nicht mehr veröffentlicht.
# Neu erzeugen: im Website-Projekt `node build.mjs && node tools/redirects.mjs`, dann den Ordner hier ersetzen.
on:
  push:
    branches: [main]
    paths:
      - "pages-weiterleitung/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-weiterleitung

      - id: deployment
        uses: actions/deploy-pages@v4
