name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what did you see?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      description: LJ Link version, macOS or Windows version
  - type: textarea
    id: devices
    attributes:
      label: Devices
      description: Players and mixers with firmware, if relevant
  - type: textarea
    id: log
    attributes:
      label: Log
      render: text
      description: Output of the app if you started it from a terminal
